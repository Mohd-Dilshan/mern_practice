<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
</head>
<body>
    <a href="index2.html" id="btn" style="text-decoration: none; border:1px solid black;">Back</a>
    <br><br>
    <main>
        <fieldset>
            <legend>Update Your Profile</legend>
            <br>
            <label for="name">Name</label>
            <input type="name" name="name" id="name">
            <label for="username">Username</label>
            <input type="username" name="username" id="username"><br><br>
            <button>Update</button>
        </fieldset>
        <br>
        <fieldset>
            <legend>Update Your Password</legend>
            <br>
            <label for="op">Old Password</label>
            <input type="op" name="op" id="op"> <br><br>
            <label for="np">New Password</label>
            <input type="np" name="np" id="np"> <br><br>
            <label for="cp">Confirm Password</label>
            <input type="cp" name="cp" id="cp"><br><br>
            <button>Change Password</button>
        </fieldset>
    </main>
    <br>
    <hr>
    <footer style="display: flex; justify-content: center; align-items: center;"><h4>------Thank You</h4></footer>
    <hr>
    
</body>
</html>
